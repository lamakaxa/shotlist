<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SHOTLIST</title>
<style>
:root{
  --ink:#10100f;--panel:#17171a;--panel2:#1f1f23;--line:#2c2c31;
  --haze:#8d8a82;--paper:#e9e4d8;--amber:#e8a13a;--cool:#6fa8d6;--burg:#7a2018;--hot:#ff5d4d;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden;
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  font-size:15px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- shared ---------- */
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--haze);font-weight:700}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--paper);
  padding:11px 18px;border-radius:9px;font-size:14px;letter-spacing:.01em;
  transition:transform .14s var(--ease-out),border-color .14s,color .14s}
@media(hover:hover){.btn:hover{border-color:var(--amber);color:var(--amber)}}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:#1a1206}
.btn.ghost:hover{border-color:var(--cool);color:var(--cool)}
.btn.danger:hover{border-color:var(--hot);color:var(--hot)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- menu ---------- */
#menu{align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(120% 90% at 50% 10%,#1a1714 0%,#0c0c0b 60%)}
#menu .logo{font-size:clamp(48px,11vw,104px);font-weight:800;letter-spacing:-.05em;line-height:.92}
#menu .logo .dot{color:var(--amber)}
#menu .sub{color:var(--haze);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-top:14px}
#menu .tag{color:var(--paper);opacity:.7;margin-top:22px;font-size:15px;max-width:340px}
#menu .acts{display:flex;flex-direction:column;gap:11px;margin-top:38px;width:min(300px,80vw)}
#menu .beam{position:absolute;top:-10%;left:50%;width:2px;height:50%;
  background:linear-gradient(var(--amber),transparent);transform-origin:top;
  transform:translateX(-50%) rotate(14deg);opacity:.5;filter:blur(1px)}

/* ---------- board ---------- */
#board{background:var(--ink)}
.bar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
  background:var(--panel)}
.bar .brand{font-weight:800;letter-spacing:-.03em;font-size:18px}
.bar .brand .dot{color:var(--amber)}
.bar .spacer{flex:1}
.stat{font-size:12px;color:var(--haze);font-variant-numeric:tabular-nums}
.stat b{color:var(--paper);font-weight:700}
.board-body{flex:1;overflow-y:auto;padding:22px 20px;max-width:760px;width:100%;margin:0 auto}
.board-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.board-head h1{font-size:24px;letter-spacing:-.02em;font-weight:800}
.brief-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:18px 19px;margin-bottom:14px;position:relative;transition:.15s}
.brief-card.locked{opacity:.42}
.brief-card.done{border-color:#2e3a25}
.brief-card .chan{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;font-weight:700}
.chan.pr{background:#2a1410;color:#e9a78f;border:1px solid var(--burg)}
.chan.editorial{background:#1a1f2a;color:var(--cool);border:1px solid #2c3f55}
.brief-card h3{font-size:17px;margin:11px 0 6px;letter-spacing:-.01em}
.brief-card .who{font-size:12px;color:var(--haze)}
.brief-card .teach{font-size:12.5px;color:#cdbfa6;margin-top:11px;line-height:1.5;
  border-left:2px solid var(--amber);padding-left:11px}
.brief-card .meta{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--haze);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.brief-card .meta b{color:var(--paper)}
.brief-card .go{position:absolute;top:18px;right:18px}
.brief-card .badge{position:absolute;top:20px;right:20px;font-size:11px;color:#7fae5e;font-weight:700}
/* setup cards */
.setup-card{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:14px;margin-bottom:13px;align-items:flex-start}
.setup-card img{width:110px;flex:none;border-radius:9px;border:1px solid var(--line);aspect-ratio:4/5;object-fit:cover;background:#000}
.setup-card .body{flex:1;min-width:0}
.setup-card h3{font-size:16px;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.setup-card .when{font-size:11px;color:var(--haze);margin-bottom:9px}
.setup-card .lights{font-size:11.5px;color:#cdbfa6;line-height:1.55}
.setup-card .lights .lrow{padding:2px 0;border-bottom:1px dotted var(--line)}
.setup-card .lights b{color:var(--paper)}
.setup-card .camline{font-size:11px;color:var(--haze);margin-top:7px;font-variant-numeric:tabular-nums}
.setup-card .acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.setup-card .acts .btn{padding:7px 12px;font-size:12px}
.setups-empty{text-align:center;color:var(--haze);padding:50px 20px;line-height:1.7}
@media(max-width:600px){.setup-card{flex-direction:column}.setup-card img{width:100%;max-width:200px}}

/* ---------- studio ---------- */
#studio{background:#0c0c0b}
#studioGrid{flex:1;display:grid;grid-template-columns:230px 1fr 268px;grid-template-rows:1fr;min-height:0}
.panel{background:var(--panel);overflow-y:auto;overflow-x:hidden}
.panel.l{border-right:1px solid var(--line)}
.panel.r{border-left:1px solid var(--line)}
.sect{padding:13px 14px;border-bottom:1px solid var(--line)}
.sect h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);
  font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.sect h2::before{content:"";width:9px;height:1px;background:var(--amber)}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.add{background:var(--panel2);border:1px solid var(--line);color:var(--paper);font-size:11px;
  padding:9px 5px;border-radius:7px;text-align:center;line-height:1.25;
  transition:transform .12s var(--ease-out),border-color .12s}
@media(hover:hover){.add:hover{border-color:var(--amber)}}
.add:active{transform:scale(.96)}
.add .ic{display:block;font-size:15px;margin-bottom:3px}
.lt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  margin-bottom:7px;position:relative;transition:.12s}
.lt:hover{border-color:#444}
.lt.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.lt .nm{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.sw{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
.lt .mt{font-size:10px;color:var(--haze);margin-top:2px}
.lt .pw{position:absolute;top:8px;right:24px;font-size:10px;color:var(--haze)}
.lt .del{position:absolute;top:6px;right:8px;color:var(--haze);font-size:12px;opacity:.5}
.lt .del:hover{color:var(--hot);opacity:1}
.empty{font-size:11px;color:var(--haze);text-align:center;padding:7px 2px;line-height:1.5}
.ctrl{margin-bottom:11px}
.ctrl label{font-size:11px;color:var(--haze);display:flex;justify-content:space-between;margin-bottom:5px}
.ctrl label b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.subh{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);font-weight:700;
  margin:4px 0 9px;padding-top:9px;border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--haze);cursor:pointer;margin-bottom:10px}
.chk input{width:16px;height:16px;accent-color:var(--amber)}
.swbig{height:26px;border-radius:7px;margin-bottom:11px;border:1px solid var(--line)}
.rgbrow{display:flex;gap:7px;margin-top:4px}
.rgbrow span{flex:1;font-size:10px;color:var(--haze);display:flex;align-items:center;gap:4px}
.rgbrow input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--paper);
  border-radius:6px;padding:5px 4px;font-size:11px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.rgbrow input::-webkit-outer-spin-button,.rgbrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:3px;background:var(--line);outline:none;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--paper);cursor:pointer;border:2px solid var(--panel);transition:transform .12s var(--ease-out)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range].am::-webkit-slider-thumb{background:var(--amber)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--paper)}
@media(max-width:900px){
  input[type=range]{height:6px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px}
  input[type=range]::-moz-range-thumb{width:24px;height:24px}
  .ctrl{margin-bottom:18px}
}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:50px;background:var(--panel2);border:1px solid var(--line);color:var(--haze);
  font-size:10.5px;padding:7px 4px;border-radius:6px;transition:.12s;white-space:nowrap}
.seg button.on{border-color:var(--amber);color:var(--amber);background:#1c1710}
.seg button:hover{color:var(--paper)}
.kbar{height:7px;border-radius:4px;background:linear-gradient(90deg,#ff8a3c,#ffd9a0,#fff,#cfe2ff,#8fb8ff);margin-bottom:7px}

/* viewport center */
#stage{position:relative;min-width:0;background:#0c0c0b}
#c3d{width:100%;height:100%;display:block;touch-action:none}
.vtag{position:absolute;top:10px;left:12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--haze);background:rgba(12,12,11,.6);padding:4px 8px;border-radius:5px;pointer-events:none}
.vtabs{position:absolute;top:9px;right:12px;display:flex;gap:5px}
.vtabs button{background:rgba(23,23,26,.85);border:1px solid var(--line);color:var(--haze);
  font-size:10.5px;padding:6px 10px;border-radius:6px;backdrop-filter:blur(4px)}
.vtabs button.on{border-color:var(--amber);color:var(--amber)}
.vhint{position:absolute;bottom:10px;left:12px;right:12px;font-size:10.5px;color:var(--haze);
  background:rgba(12,12,11,.55);padding:5px 9px;border-radius:5px;line-height:1.45;pointer-events:none}
.vhint b{color:var(--paper)}
.briefchip{position:absolute;bottom:10px;right:12px;max-width:260px;background:rgba(23,23,26,.9);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.45;
  backdrop-filter:blur(4px)}
.briefchip .t{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.briefchip b{color:var(--paper)}

/* camera/model right panel */
.read{font-size:11px;color:var(--haze);line-height:1.85;font-variant-numeric:tabular-nums}
.read .row{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:1px 0}
.read .row b{color:var(--paper)}
.expo{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:3px}
.expo.ok{background:#16210f;color:#8fd06a;border:1px solid #2e3a25}
.expo.under{background:#0f1722;color:var(--cool);border:1px solid #2c3f55}
.expo.over{background:#221512;color:#ef8e6a;border:1px solid #44241a}

/* shoot bar */
.shootbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);
  background:var(--panel)}
.shootbar .spacer{flex:1}
.shootbar .left{font-size:12px;color:var(--haze)}
.shootbar .left b{color:var(--paper)}

/* review modal */
.modal{position:fixed;inset:0;background:rgba(8,8,7,.86);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;backdrop-filter:blur(3px)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:15px;max-width:640px;width:100%;
  max-height:90vh;overflow-y:auto;padding:24px}
.sheet h2{font-size:21px;letter-spacing:-.01em;margin-bottom:5px}
.sheet .sub{color:var(--haze);font-size:13px;margin-bottom:18px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-bottom:18px}
.shot{border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;cursor:pointer;transition:.13s}
.shot img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
.shot .sc{position:absolute;bottom:0;left:0;right:0;background:rgba(12,12,11,.82);font-size:11px;
  text-align:center;padding:2px;font-variant-numeric:tabular-nums}
.shot.best{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.shot.best .sc{color:var(--amber)}
.shotbig{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;background:#000}
.shotbig img{width:100%;display:block;max-height:52vh;object-fit:contain}
.shotpct{position:absolute;top:10px;right:10px;background:rgba(12,12,11,.85);color:var(--hot);
  font-weight:800;font-size:16px;padding:4px 11px;border-radius:20px;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.shotpct.ok{color:#8fd06a;border-color:#2e3a25}
.bigscore{font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bigscore.pass{color:#8fd06a}.bigscore.fail{color:var(--hot)}
.fbk{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.55;color:#d8c8aa;margin-bottom:18px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* result modal */
.reward{display:flex;gap:22px;justify-content:center;margin:16px 0 20px}
.reward div{text-align:center}
.reward .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.reward .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);margin-top:3px}

/* mobile bottom-sheet tab bar */
#mnav{display:none}
#sheetBackdrop{display:none}
@media(max-width:900px){
  /* 3D fills the screen; panels become a sheet */
  #studioGrid{display:block;position:relative;flex:1;min-height:0}
  #stage{position:absolute;inset:0}
  .panel.l,.panel.r{
    position:fixed;left:0;right:0;bottom:calc(60px + var(--sab));z-index:40;
    background:var(--panel);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;max-height:60dvh;
    padding-bottom:18px;
    transform:translateY(140%);transition:transform .34s var(--ease-drawer);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);overscroll-behavior:contain}
  .panel.l.open,.panel.r.open{transform:translateY(0)}
  /* grab handle */
  .panel.l::before,.panel.r::before{content:"";display:block;width:38px;height:4px;
    border-radius:4px;background:var(--line);margin:9px auto 2px}
  #sheetBackdrop.show{display:block;position:fixed;inset:0;z-index:35;
    background:rgba(8,8,7,.4);backdrop-filter:blur(1px)}
  .vhint{display:none}
  .briefchip{bottom:74px;max-width:52vw;font-size:10.5px}
  .vtabs{top:calc(10px + var(--sat))}
  .vtag{top:calc(10px + var(--sat))}
  /* studio top bar compact */
  #studio .bar{padding:calc(8px + var(--sat)) 14px 8px}
  #s_brief{font-size:13px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* hide the old desktop shoot bar; mobile uses the nav */
  #studio .shootbar{display:none}
  /* bottom tab nav */
  #mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--panel);border-top:1px solid var(--line);
    padding:7px 8px calc(7px + var(--sab));gap:6px;align-items:stretch}
  #mnav button{flex:1;background:transparent;border:none;color:var(--haze);
    font-size:10px;letter-spacing:.02em;padding:6px 2px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:transform .12s var(--ease-out),color .12s,background .12s}
  #mnav button .ic{font-size:19px;line-height:1}
  #mnav button.on{color:var(--amber);background:#1c1710}
  #mnav button:active{transform:scale(.94)}
  #mnav .shoot{color:#1a1206;background:var(--amber);font-weight:700}
  #mnav .shoot.on{color:#1a1206}
  /* roomier controls inside sheet */
  .panel.l .sect,.panel.r .sect{padding:14px 16px}
  .add{padding:13px 6px;font-size:12px}
  .seg button{padding:11px 6px;font-size:12px}
  .lt{padding:11px 13px}
  .lt .del{font-size:16px;padding:4px;opacity:.7}
}
/* larger tap targets for light shelf everywhere */
.add{min-height:52px}
.scr::-webkit-scrollbar{width:7px}
.scr::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
</style>
</head>
<body>

<!-- ============ MENU ============ -->
<div id="menu" class="screen">
  <div class="beam"></div>
  <div class="logo">SHOT<span class="dot">·</span>LIST</div>
  <div class="sub" id="m_sub"></div>
  <div class="tag" id="m_tag"></div>
  <div class="acts">
    <button class="btn primary" id="m_new"></button>
    <button class="btn ghost" id="m_free"></button>
    <button class="btn" id="m_setups"></button>
    <button class="btn" id="m_how"></button>
  </div>
</div>

<!-- ============ BOARD ============ -->
<div id="board" class="screen hidden">
  <div class="bar">
    <div class="brand">SHOT<span class="dot">·</span>LIST</div>
    <div class="spacer"></div>
    <div class="stat" id="b_rep"></div>
    <div class="stat" id="b_money"></div>
  </div>
  <div class="board-body scr">
    <div class="board-head">
      <h1 id="b_title"></h1>
    </div>
    <div id="b_list"></div>
  </div>
</div>

<!-- ============ MY SETUPS ============ -->
<div id="setups" class="screen hidden">
  <div class="bar">
    <button class="btn" id="setups_back" style="padding:8px 13px">‹ Меню</button>
    <div class="brand" style="font-size:16px">Мои сетапы</div>
    <div class="spacer"></div>
  </div>
  <div class="board-body scr">
    <div id="setupsList"></div>
  </div>
</div>

<!-- ============ STUDIO ============ -->
<div id="studio" class="screen hidden">
  <div class="bar">
    <button class="btn" id="s_back" style="padding:8px 13px"></button>
    <div class="brand" style="font-size:15px" id="s_brief"></div>
    <div class="spacer"></div>
    <div class="stat" id="s_match"></div>
  </div>
  <div id="studioGrid">
    <!-- LEFT: lights -->
    <aside class="panel l scr">
      <div class="sect">
        <h2 id="t_shelf"></h2>
        <div class="addrow" id="shelf"></div>
      </div>
      <div class="sect">
        <h2 id="t_lights"></h2>
        <div id="lightList"></div>
      </div>
      <div class="sect">
        <div class="ctrl"><label>Фон</label>
          <div class="seg" id="bgSeg">
            <button data-bg="studio" class="on">Студия</button>
            <button data-bg="street">Улица</button>
            <button data-bg="photo">Моё фото</button>
          </div>
        </div>
        <button class="btn" id="bgUpload" style="width:100%;display:none;padding:9px;font-size:12px">⤒ Загрузить локацию</button>
        <input type="file" id="bgFile" accept="image/*" style="display:none">
        <div id="bgEnv" class="tiny" style="margin-top:7px"></div>
        <div class="ctrl" style="margin-top:12px"><label><span id="t_amb"></span><b id="ambV">3%</b></label>
          <input type="range" id="amb" min="0" max="40" value="3"></div>
        <div class="ctrl"><label><span id="t_bg"></span><b id="bgV"></b></label>
          <input type="range" id="bgTone" min="0" max="100" value="20"></div>
      </div>
    </aside>
    <!-- CENTER: viewport -->
    <section id="stage">
      <canvas id="c3d"></canvas>
      <div class="vtag" id="vtag"></div>
      <div class="vtabs" id="vtabs"></div>
      <div class="vhint" id="vhint"></div>
      <div class="briefchip" id="briefchip"></div>
    </section>
    <!-- RIGHT: selected light + camera + model -->
    <aside class="panel r scr">
      <div class="sect" id="lp">
        <h2 id="lpTitle"></h2>
        <div id="lpEmpty" class="empty"></div>
        <div id="lpBody" class="hidden">
          <div class="ctrl"><label><span id="t_pow"></span><b id="powV"></b></label><input type="range" class="am" id="pow" min="0" max="100" value="100"></div>
          <div class="ctrl"><label><span id="t_temp"></span><b id="kV"></b></label><div class="kbar"></div><input type="range" id="kelvin" min="2700" max="8000" value="5500"></div>
          <div class="ctrl"><label><span id="t_feat"></span><b id="featV"></b></label><input type="range" id="feat" min="0" max="100" value="60"></div>
          <div class="ctrl"><label><span id="t_cone"></span><b id="coneV"></b></label><input type="range" id="cone" min="8" max="90" value="55"></div>
          <div class="ctrl"><label><span id="t_h"></span><b id="hV"></b></label><input type="range" id="hgt" min="20" max="320" value="170"></div>
          <div class="ctrl"><label><span id="t_tilt"></span><b id="tiltV"></b></label><input type="range" id="tilt" min="-60" max="60" value="0"></div>
          <div class="subh">Положение (оси)</div>
          <div class="ctrl"><label>X <b id="lxV">0.0</b></label><input type="range" id="lx" min="-6" max="6" step="0.05" value="0"></div>
          <div class="ctrl"><label>Y <b id="lyV">0.0</b></label><input type="range" id="ly" min="0.1" max="3.6" step="0.05" value="2"></div>
          <div class="ctrl"><label>Z <b id="lzV">0.0</b></label><input type="range" id="lz" min="-6" max="6" step="0.05" value="3"></div>
          <div class="subh">Цвет источника</div>
          <label class="chk"><input type="checkbox" id="lcustom"> свой цвет (вместо Кельвинов)</label>
          <div id="colBody" class="hidden">
            <div class="swbig" id="lswatch"></div>
            <div class="ctrl"><label>H <b id="lhV">40</b></label><input type="range" id="lh" min="0" max="360" value="40"></div>
            <div class="ctrl"><label>S <b id="lsV">60</b></label><input type="range" id="ls" min="0" max="100" value="60"></div>
            <div class="ctrl"><label>L <b id="llV">55</b></label><input type="range" id="ll" min="0" max="100" value="55"></div>
            <div class="rgbrow">
              <span>R <input type="number" id="lr" min="0" max="255" value="255"></span>
              <span>G <input type="number" id="lg" min="0" max="255" value="200"></span>
              <span>B <input type="number" id="lb" min="0" max="255" value="120"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="sect">
        <h2 id="t_cam"></h2>
        <div class="ctrl"><label>ISO <b id="isoV">200</b></label><input type="range" id="iso" min="100" max="3200" step="100" value="200"></div>
        <div class="ctrl"><label><span id="t_sh"></span> <b id="shV">1/125</b></label><input type="range" id="shutter" min="30" max="1000" step="5" value="125"></div>
        <div class="ctrl"><label><span id="t_ap"></span> <b id="apV">f/4.0</b></label><input type="range" id="aperture" min="14" max="160" step="1" value="40"></div>
        <div class="ctrl"><label><span id="t_fl"></span> <b id="flV">85mm</b></label><input type="range" id="focal" min="24" max="200" step="1" value="85"></div>
        <div id="expoTag"></div>
        <div class="subh">Положение камеры (оси)</div>
        <div class="ctrl"><label>X <b id="cxV">0.0</b></label><input type="range" id="cx" min="-14" max="14" step="0.1" value="0"></div>
        <div class="ctrl"><label>Y <b id="cyV">0.0</b></label><input type="range" id="cy" min="-10" max="12" step="0.1" value="3"></div>
        <div class="ctrl"><label>Z <b id="czV">0.0</b></label><input type="range" id="cz" min="-14" max="14" step="0.1" value="5"></div>
      </div>
      <div class="sect">
        <h2 id="t_model"></h2>
        <div class="ctrl"><label id="t_poseL"></label>
          <div class="seg" id="poseSeg"></div></div>
        <div class="ctrl"><label><span id="t_bodyturn"></span><b id="btV">0°</b></label><input type="range" id="bodyTurn" min="-90" max="90" value="0"></div>
        <div class="ctrl"><label><span id="t_headturn"></span><b id="htV">0°</b></label><input type="range" id="headTurn" min="-70" max="70" value="0"></div>
        <div class="ctrl"><label>Размер модели <b id="mscaleV">100%</b></label><input type="range" id="mscale" min="50" max="180" value="100"></div>
      </div>
    </aside>
  </div>
  <div class="shootbar">
    <div class="left" id="shootInfo"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="hintBtn"></button>
    <button class="btn primary" id="shootBtn"></button>
  </div>
  <!-- mobile backdrop + tab nav -->
  <div id="sheetBackdrop"></div>
  <nav id="mnav">
    <button data-sheet="l"><span class="ic">◗</span><span>Свет</span></button>
    <button data-sheet="r"><span class="ic">◎</span><span>Камера</span></button>
    <button id="mHint"><span class="ic">💡</span><span id="mHintL">Подсказка</span></button>
    <button class="shoot" id="mShoot"><span class="ic">◉</span><span id="mShootL">Кадр</span></button>
  </nav>
</div>

<!-- review modal mount -->
<div id="modalMount"></div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
